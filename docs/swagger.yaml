basePath: /api/v1
definitions:
  httpapi.ErrorResponse:
    properties:
      code:
        example: VALIDATION_ERROR
        type: string
      error:
        example: customer is required
        type: string
    required:
    - code
    - error
    type: object
  httpapi.OrderResponse:
    properties:
      customer:
        example: Алиса
        type: string
      id:
        example: 1
        minimum: 1
        type: integer
      status:
        enum:
        - new
        - cancelled
        example: new
        type: string
    required:
    - customer
    - id
    - status
    type: object
  httpapi.StatusResponse:
    properties:
      status:
        example: ok
        type: string
    required:
    - status
    type: object
info:
  contact: {}
  title: сервис заказов
  version: "1.0"
paths:
  /orders:
    get:
      description: возвращает список заказов c пагинацией; сортировка всегда по id
        по возрастанию
      parameters:
      - default: 20
        description: Размер страницы
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/httpapi.OrderResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: список заказов
      tags:
      - orders
  /orders/{id}:
    get:
      description: возвращает заказ по положительному числовому идентификатору
      parameters:
      - description: Номер заказа
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.OrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: получение заказа по номеру
      tags:
      - orders
  /status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.StatusResponse'
      summary: проверка статуса сервиса
      tags:
      - status
swagger: "2.0"
